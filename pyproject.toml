[project]
name = "deeptalk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "faster-whisper>=1.1.0",
    "fastapi",
    "httpx",
    "hydra-core>=1.3.2",
    "lightning>=2.4.0",
    "nemo-toolkit[asr]>=2.7.3",
    "numpy>=2.4.6",
    "python-multipart>=0.0.30",
    "sounddevice>=0.5.5",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "uvicorn[standard]",
    "websockets",
    "transformers>=4.57.6",
]

[project.optional-dependencies]
gpu = [
    "torch ; sys_platform == 'linux'",
    "nemo_toolkit[asr] ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptalk"]
