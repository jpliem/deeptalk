[project]
name = "deeptalk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "numpy>=2.4.6",
    "sounddevice>=0.5.5",
    "uvicorn[standard]",
    "websockets",
]

[project.optional-dependencies]
gpu = [
    "torch ; sys_platform == 'linux'",
    "nemo_toolkit[asr] ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deeptalk"]
